name: Pages

# Publishes the privacy policy (docs/PRIVACY.md) and a small landing page to GitHub Pages.
# One-time repo setup: Settings → Pages → Build and deployment → Source = GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/PRIVACY.md'
      - 'build/build-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build site
        run: |
          python -m pip install --quiet markdown
          python build/build-site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
