name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetMetter.sln

      - name: Build
        run: dotnet build NetMetter.sln -c Release --no-restore

      - name: Check formatting
        run: dotnet format NetMetter.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/NetMetter.Tests/NetMetter.Tests.csproj -c Release --no-build --verbosity normal

      # Prove the package builds on every change. Uses the dev identity (unsigned) and the
      # csproj version; a real Store bundle is produced by release.yml with the Partner Center identity.
      - name: Package (unsigned, smoke test)
        run: ./build/Package.ps1
        shell: pwsh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmetter-msixbundle-unsigned
          path: out/*.msixbundle
          if-no-files-found: error
