name: Release

# Tag a release to run this:  git tag v1.2.0 && git push origin v1.2.0
# Build the signed-by-Store bundle, publish to the test flight, then (after a manual
# approval on the store-production environment) roll it out to 10% of production.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (MAJOR.MINOR.PATCH), e.g. 1.2.0'
        required: true

permissions:
  contents: write   # create the GitHub Release

env:
  # Package identity from Partner Center › Product management › Product identity.
  # Not secret, but kept as repo variables so the manifest template stays generic.
  NETMETTER_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
  NETMETTER_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
  NETMETTER_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' }
               else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be MAJOR.MINOR.PATCH; got '$v'." }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test tests/NetMetter.Tests/NetMetter.Tests.csproj -c Release

      - name: Build MSIX bundle (x64 + arm64)
        run: ./build/Package.ps1 -Version ${{ steps.version.outputs.value }} -Architecture x64,arm64
        shell: pwsh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: out/*.msixbundle
          if-no-files-found: error

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          files: out/*.msixbundle
          generate_release_notes: true

  store-flight:
    needs: build
    # Skip Store publishing until it is switched on (repo variable STORE_PUBLISH_ENABLED=true).
    # The app must be live in the Store and the PARTNER_CENTER_* secrets configured first.
    if: vars.STORE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    environment: store-flight
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: out

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sign in to Partner Center
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Publish to the test flight
        shell: pwsh
        run: |
          $bundle = (Get-Item out/*.msixbundle).FullName
          msstore publish $bundle --appId ${{ vars.STORE_PRODUCT_ID }} --flightId ${{ vars.STORE_FLIGHT_ID }}

  store-production:
    needs: [build, store-flight]
    if: vars.STORE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    environment: store-production   # add required reviewers on this environment
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: out

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sign in to Partner Center
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Publish to production at 10%
        shell: pwsh
        run: |
          $bundle = (Get-Item out/*.msixbundle).FullName
          msstore publish $bundle --appId ${{ vars.STORE_PRODUCT_ID }} --packageRolloutPercentage 10

      - name: Wait for certification
        run: msstore submission poll ${{ vars.STORE_PRODUCT_ID }}
